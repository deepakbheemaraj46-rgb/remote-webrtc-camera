<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Viewer</title><style>body{font-family:Arial;background:#111;color:#fff;text-align:center;padding:20px}video{width:100%;max-width:700px;background:#000;border-radius:12px}</style></head><body><h2>👁 Live Viewer</h2><p>Room: demo</p><video id="v" autoplay playsinline controls></video><p id="s">Connecting...</p><script>
const room="demo",ws=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host),cfg={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};let pc=new RTCPeerConnection(cfg),q=[],started=false;
const send=x=>ws.readyState===1&&ws.send(JSON.stringify({...x,room}));
pc.onicecandidate=e=>e.candidate&&send({type:"ice",candidate:e.candidate});pc.ontrack=e=>{v.srcObject=e.streams[0];s.textContent="LIVE"};
async function offer(){if(started)return;started=true;let o=await pc.createOffer();await pc.setLocalDescription(o);send({type:"offer",offer:o});s.textContent="Connecting to camera..."};
ws.onopen=()=>send({type:"join"});
ws.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==="joined"&&m.peers>0)offer();else if(m.type==="peer-ready")offer();else if(m.type==="answer"){await pc.setRemoteDescription(m.answer);for(const c of q)try{await pc.addIceCandidate(c)}catch{}q=[];s.textContent="LIVE"}else if(m.type==="ice"){if(pc.remoteDescription)try{await pc.addIceCandidate(m.candidate)}catch{}else q.push(m.candidate)}else if(m.type==="peer-left"){started=false;s.textContent="Camera disconnected.";v.srcObject=null}};
</script></body></html>
