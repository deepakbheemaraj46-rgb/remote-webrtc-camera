<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Live Camera</title>
<style>body{font-family:Arial;background:#111;color:#fff;text-align:center;padding:20px}video{width:100%;max-width:700px;background:#000;border-radius:12px}button{padding:14px 22px;margin:12px;font-size:17px;border:0;border-radius:8px}</style>
<h2>📷 Live Camera</h2><p>Room: demo</p><video id=video autoplay playsinline muted></video><br><button onclick=startCamera()>Start Camera</button><p id=status>Waiting...</p>
<script>const room=new URLSearchParams(location.search).get('room')||'demo';
const ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);
let pc,stream;
const cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
function send(x){if(ws.readyState===1)ws.send(JSON.stringify({...x,room}))}
function makePC(){pc=new RTCPeerConnection(cfg);pc.onicecandidate=e=>e.candidate&&send({type:'ice',candidate:e.candidate});}
ws.onopen=()=>send({type:'join'});
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});video.srcObject=stream;makePC();stream.getTracks().forEach(t=>pc.addTrack(t,stream));status.textContent='Camera running. Open viewer.'}catch(e){status.textContent=e.message}}
ws.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==='offer'){if(!pc){makePC();if(stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream))}await pc.setRemoteDescription(m.offer);let a=await pc.createAnswer();await pc.setLocalDescription(a);send({type:'answer',answer:a})}else if(m.type==='ice'&&pc){try{await pc.addIceCandidate(m.candidate)}catch{}}};</script>
