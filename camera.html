<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Camera</title><style>body{font-family:Arial;background:#111;color:#fff;text-align:center;padding:20px}video{width:100%;max-width:700px;background:#000;border-radius:12px}button{padding:14px 22px;margin:12px;font-size:17px;border:0;border-radius:8px}</style></head><body><h2>📷 Live Camera</h2><p>Room: demo</p><video id="v" autoplay playsinline muted></video><br><button id="b">Start Camera</button><p id="s">Waiting...</p><script>
const room="demo",ws=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host),cfg={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};let pc,stream,q=[];
const send=x=>ws.readyState===1&&ws.send(JSON.stringify({...x,room}));
function make(){pc=new RTCPeerConnection(cfg);pc.onicecandidate=e=>e.candidate&&send({type:"ice",candidate:e.candidate});}
ws.onopen=()=>send({type:"join"});
b.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});v.srcObject=stream;make();stream.getTracks().forEach(t=>pc.addTrack(t,stream));s.textContent="Camera running. Open Viewer."}catch(e){s.textContent=e.message}};
ws.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==="offer"){if(!pc)make();if(stream&&pc.getSenders().length===0)stream.getTracks().forEach(t=>pc.addTrack(t,stream));await pc.setRemoteDescription(m.offer);for(const c of q)try{await pc.addIceCandidate(c)}catch{}q=[];let a=await pc.createAnswer();await pc.setLocalDescription(a);send({type:"answer",answer:a});s.textContent="Live connection established."}else if(m.type==="ice"){if(pc&&pc.remoteDescription)try{await pc.addIceCandidate(m.candidate)}catch{}else q.push(m.candidate)}else if(m.type==="peer-left")s.textContent="Viewer disconnected."};
</script></body></html>
